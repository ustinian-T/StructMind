# StructMind Nginx 反向代理配置
# 用于生产环境部署（HTTPS终结 + 静态文件缓存 + 安全头）

server {
    listen 443 ssl http2;
    server_name structmind.example.com;

    # SSL 证书
    ssl_certificate     /etc/ssl/structmind.crt;
    ssl_certificate_key /etc/ssl/structmind.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 静态文件缓存
    location /assets/ {
        alias /app/runtime/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        alias /app/static/;
        expires 7d;
    }

    location /logo.svg {
        alias /app/static/logo.svg;
        expires 30d;
    }

    # API 反向代理到 Python 后端
    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;  # AI流式响应需要较长超时
        proxy_buffering off;       # SSE流式输出
    }

    # WebSocket AI 导师
    location /ws/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # 前端 SPA
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 拒绝敏感文件
    location ~ /\. {
        deny all;
    }
    location ~ \.py$ {
        deny all;
    }
    location ~ \.sqlite3$ {
        deny all;
    }
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name structmind.example.com;
    return 301 https://$server_name$request_uri;
}
